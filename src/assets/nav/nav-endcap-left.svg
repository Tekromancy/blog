<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 60" fill="none" preserveAspectRatio="none">
  <defs>
    <!-- Intense High-Voltage Plasma Glow Filter -->
    <filter id="tesla-plasma-l-v3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="blur1" />
      <feGaussianBlur stdDeviation="3.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients for Live Electric Arcs -->
    <linearGradient id="tesla-bolt-l-v3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="15%" stop-color="#86efac" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Electrified Plate Radial Field -->
    <radialGradient id="plasma-core-glow-l-v3" cx="35%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#052e16" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes spark-ignition {
      0%, 100% { opacity: 0.95; transform: scale(1); }
      8% { opacity: 0.4; transform: scale(0.9); }
      14% { opacity: 1; transform: scale(1.15); }
      35% { opacity: 0.7; transform: scale(0.95); }
      52% { opacity: 1; transform: scale(1.2); }
      68% { opacity: 0.55; transform: scale(0.92); }
      82% { opacity: 1; transform: scale(1.1); }
    }
    @keyframes tesla-body-surge {
      0%, 100% { opacity: 0.95; }
      15% { opacity: 0.65; }
      20% { opacity: 1; }
      55% { opacity: 0.7; }
      60% { opacity: 1; }
      80% { opacity: 0.8; }
    }
    .spark-gap-active {
      animation: spark-ignition 0.9s infinite ease-in-out;
      transform-origin: center;
    }
    .live-body-arc {
      animation: tesla-body-surge 1.5s infinite ease-in-out;
    }
  </style>

  <!-- Dark Base Armor Plate with 45-degree Chamfers -->
  <polygon 
    points="14,1 46,1 46,59 14,59 1.5,46.5 1.5,13.5" 
    fill="#020804" 
    stroke="#14532d" 
    stroke-width="1.2" 
  />
  <polygon 
    points="14,1 46,1 46,59 14,59 1.5,46.5 1.5,13.5" 
    fill="url(#plasma-core-glow-l-v3)" 
  />

  <!-- Internal Circuit PCB Tracks (Etched in Hull) -->
  <g stroke="#22c55e" stroke-width="0.8" fill="none" opacity="0.65">
    <path d="M 46,12 L 28,12 L 20,20 L 12,20 L 6,14" />
    <path d="M 46,48 L 28,48 L 20,40 L 12,40 L 6,46" />
    <line x1="24" y1="2" x2="24" y2="58" stroke-dasharray="2 4" opacity="0.4" />
  </g>

  <!-- Central Capacitor / Plasma Reactor Cell -->
  <g>
    <rect x="11" y="24" width="12" height="12" rx="2" fill="#041f0d" stroke="#22c55e" stroke-width="1" />
    <polygon points="17,25 22,30 17,35 12,30" fill="#22c55e" opacity="0.85" filter="url(#tesla-plasma-l-v3)" />
    <polygon points="17,27 20,30 17,33 14,30" fill="#ffffff" filter="url(#tesla-plasma-l-v3)" />
    <line x1="7" y1="30" x2="11" y2="30" stroke="#ffffff" stroke-width="1.2" />
    <line x1="23" y1="30" x2="27" y2="30" stroke="#86efac" stroke-width="1.2" />
  </g>

  <!-- High-Voltage Outer Contour Lightning Surge -->
  <path 
    class="live-body-arc"
    d="M 32,2 L 24,1 L 14,2 L 9,7 L 2,13 L 0.5,19 L 3,25 L 0.5,31 L 3.5,37 L 1,44 L 2.5,48 L 10,54 L 14,58 L 24,59 L 32,58" 
    stroke="#22c55e" 
    stroke-width="3.2" 
    stroke-linecap="round" 
    stroke-linejoin="miter" 
    fill="none" 
    filter="url(#tesla-plasma-l-v3)" 
  />
  <path 
    class="live-body-arc"
    d="M 32,2 L 24,1 L 14,2 L 9,7 L 2,13 L 0.5,19 L 3,25 L 0.5,31 L 3.5,37 L 1,44 L 2.5,48 L 10,54 L 14,58 L 24,59 L 32,58" 
    stroke="url(#tesla-bolt-l-v3)" 
    stroke-width="1.8" 
    stroke-linecap="round" 
    stroke-linejoin="miter" 
    fill="none" 
  />
  <path 
    class="live-body-arc"
    d="M 32,2 L 24,1 L 14,2 L 9,7 L 2,13 L 0.5,19 L 3,25 L 0.5,31 L 3.5,37 L 1,44 L 2.5,48 L 10,54 L 14,58 L 24,59 L 32,58" 
    stroke="#ffffff" 
    stroke-width="0.9" 
    stroke-linecap="round" 
    stroke-linejoin="miter" 
    fill="none" 
  />

  <!-- Exterior Corona Discharges Shooting Into Void from Armor Teeth -->
  <g stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" fill="none" filter="url(#tesla-plasma-l-v3)">
    <path d="M 2,13 L -2,9 L -1,5" stroke="#ffffff" />
    <path d="M 0.5,19 L -4,21 L -1,23" stroke="#38bdf8" />
    <path d="M 0.5,31 L -5,30 L -2,34" stroke="#ffffff" />
    <path d="M 2.5,48 L -2,52 L -1,56" stroke="#86efac" />
  </g>

  <!-- =================================================================== -->
  <!-- 1. TOP SPARK PLUG TERMINAL: Initiates Electricity Across Top Rail   -->
  <!-- =================================================================== -->
  <g id="left-top-spark-plug">
    <!-- Ceramic Ribbed Insulator Barrel -->
    <rect x="25" y="0.8" width="9.5" height="4.4" rx="1.2" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.6" />
    <line x1="28" y1="0.8" x2="28" y2="5.2" stroke="#64748b" stroke-width="0.8" />
    <line x1="31" y1="0.8" x2="31" y2="5.2" stroke="#64748b" stroke-width="0.8" />

    <!-- Brass / Bronze Hex Nut Collar -->
    <rect x="34.5" y="0.4" width="3.5" height="5.2" rx="0.5" fill="#ca8a04" stroke="#854d0e" stroke-width="0.6" />
    <line x1="36.2" y1="0.4" x2="36.2" y2="5.6" stroke="#fef08a" stroke-width="0.6" />

    <!-- Threaded Metal Shell -->
    <rect x="38" y="1.2" width="2.5" height="3.6" fill="#475569" stroke="#1e293b" stroke-width="0.5" />

    <!-- Tungsten Center Electrode Core -->
    <line x1="40.5" y1="3" x2="43.5" y2="3" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" />

    <!-- L-Shaped Ground Strap -->
    <path d="M 39,0.3 L 44,0.3 L 44,1.8" stroke="#cbd5e1" stroke-width="0.9" fill="none" />

    <!-- ACTIVE SPARK GAP & PLASMA DISCHARGE INITIATOR -->
    <g class="spark-gap-active">
      <!-- High-Voltage Arc Gap Flash -->
      <circle cx="44" cy="2.5" r="2.2" fill="#ffffff" filter="url(#tesla-plasma-l-v3)" />
      <circle cx="44" cy="2.5" r="1.1" fill="#86efac" />
      
      <!-- Electricity Launch Jet (Arced Bolt Fired Across into Top Rail) -->
      <path 
        d="M 44,2.5 L 45.5,1.2 L 46.5,3.2 L 48,1.8 L 49.5,3.5 L 51,2.2" 
        stroke="#ffffff" 
        stroke-width="1.6" 
        stroke-linecap="round" 
        stroke-linejoin="miter" 
        fill="none" 
        filter="url(#tesla-plasma-l-v3)" 
      />
      <path 
        d="M 44,2.5 L 45.5,1.2 L 46.5,3.2 L 48,1.8 L 49.5,3.5 L 51,2.2" 
        stroke="#22c55e" 
        stroke-width="2.6" 
        stroke-linecap="round" 
        stroke-linejoin="miter" 
        fill="none" 
        opacity="0.8" 
      />
    </g>
  </g>

  <!-- =================================================================== -->
  <!-- 2. BOTTOM SPARK PLUG TERMINAL: Initiates Electricity Across Bottom Rail -->
  <!-- =================================================================== -->
  <g id="left-bottom-spark-plug">
    <!-- Ceramic Ribbed Insulator Barrel -->
    <rect x="25" y="54.8" width="9.5" height="4.4" rx="1.2" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.6" />
    <line x1="28" y1="54.8" x2="28" y2="59.2" stroke="#64748b" stroke-width="0.8" />
    <line x1="31" y1="54.8" x2="31" y2="59.2" stroke="#64748b" stroke-width="0.8" />

    <!-- Brass / Bronze Hex Nut Collar -->
    <rect x="34.5" y="54.4" width="3.5" height="5.2" rx="0.5" fill="#ca8a04" stroke="#854d0e" stroke-width="0.6" />
    <line x1="36.2" y1="54.4" x2="36.2" y2="59.6" stroke="#fef08a" stroke-width="0.6" />

    <!-- Threaded Metal Shell -->
    <rect x="38" y="55.2" width="2.5" height="3.6" fill="#475569" stroke="#1e293b" stroke-width="0.5" />

    <!-- Tungsten Center Electrode Core -->
    <line x1="40.5" y1="57" x2="43.5" y2="57" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" />

    <!-- L-Shaped Ground Strap -->
    <path d="M 39,59.7 L 44,59.7 L 44,58.2" stroke="#cbd5e1" stroke-width="0.9" fill="none" />

    <!-- ACTIVE SPARK GAP & PLASMA DISCHARGE INITIATOR -->
    <g class="spark-gap-active">
      <!-- High-Voltage Arc Gap Flash -->
      <circle cx="44" cy="57.5" r="2.2" fill="#ffffff" filter="url(#tesla-plasma-l-v3)" />
      <circle cx="44" cy="57.5" r="1.1" fill="#38bdf8" />
      
      <!-- Electricity Launch Jet (Arced Bolt Fired Across into Bottom Rail) -->
      <path 
        d="M 44,57.5 L 45.5,58.8 L 46.5,56.8 L 48,58.2 L 49.5,56.5 L 51,57.8" 
        stroke="#ffffff" 
        stroke-width="1.6" 
        stroke-linecap="round" 
        stroke-linejoin="miter" 
        fill="none" 
        filter="url(#tesla-plasma-l-v3)" 
      />
      <path 
        d="M 44,57.5 L 45.5,58.8 L 46.5,56.8 L 48,58.2 L 49.5,56.5 L 51,57.8" 
        stroke="#38bdf8" 
        stroke-width="2.6" 
        stroke-linecap="round" 
        stroke-linejoin="miter" 
        fill="none" 
        opacity="0.8" 
      />
    </g>
  </g>

  <!-- Plasma Spark Balls at Sharp Vertices -->
  <circle cx="2" cy="13" r="1.8" fill="#ffffff" filter="url(#tesla-plasma-l-v3)" />
  <circle cx="0.5" cy="19" r="1.6" fill="#86efac" filter="url(#tesla-plasma-l-v3)" />
  <circle cx="0.5" cy="31" r="1.8" fill="#38bdf8" filter="url(#tesla-plasma-l-v3)" />
  <circle cx="2.5" cy="48" r="1.8" fill="#ffffff" filter="url(#tesla-plasma-l-v3)" />

  <!-- Solder Vias with Glowing Plasma Rings -->
  <circle cx="28" cy="12" r="2" fill="#000000" stroke="#4ade80" stroke-width="1" />
  <circle cx="28" cy="12" r="1" fill="#ffffff" filter="url(#tesla-plasma-l-v3)" />

  <circle cx="28" cy="48" r="2" fill="#000000" stroke="#38bdf8" stroke-width="1" />
  <circle cx="28" cy="48" r="1" fill="#ffffff" filter="url(#tesla-plasma-l-v3)" />
</svg>
