<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 52" fill="none" class="tekromancy-brand-svg">
  <defs>
    <!-- Neon Glow Filter -->
    <filter id="neon-glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur1" />
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="lightning-spark" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="cyber-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22EE44" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22EE44" />
    </linearGradient>

    <linearGradient id="circuit-wire-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#4ade80" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="lightning-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#86efac" />
      <stop offset="70%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background Cyber Plate (Subtle dark plate with chamfered corners) -->
  <polygon points="4,2 286,2 288,4 288,48 286,50 4,50 2,48 2,4" fill="#040805" stroke="#163821" stroke-width="1" />
  
  <!-- Corner Tech Brackets -->
  <path d="M 2,12 L 2,4 L 10,4" stroke="#22c55e" stroke-width="1.5" fill="none" opacity="0.9" />
  <path d="M 288,12 L 288,4 L 280,4" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.9" />
  <path d="M 2,40 L 2,48 L 10,48" stroke="#22c55e" stroke-width="1.5" fill="none" opacity="0.9" />
  <path d="M 288,40 L 288,48 L 280,48" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.9" />

  <!-- Lightning Circuit Line Across Top -->
  <path d="M 12,4 L 38,4 L 44,9 L 110,9 L 114,4 L 180,4 L 184,8 L 240,8 L 244,4 L 278,4" stroke="url(#circuit-wire-grad)" stroke-width="1" fill="none" />
  <circle cx="44" cy="9" r="1.5" fill="#22c55e" filter="url(#lightning-spark)" />
  <circle cx="184" cy="8" r="1.5" fill="#4ade80" filter="url(#lightning-spark)" />
  <circle cx="244" cy="4" r="1.5" fill="#38bdf8" filter="url(#lightning-spark)" />

  <!-- Left Icon: Hexagonal Technomancer Terminal Core -->
  <g transform="translate(10, 8)">
    <!-- Hexagon Frame -->
    <polygon points="18,1 33,9.5 33,26.5 18,35 3,26.5 3,9.5" fill="#09140c" stroke="#22c55e" stroke-width="1.5" filter="url(#neon-glow-green)" />
    
    <!-- Inner Circuit Tracks -->
    <path d="M 3,18 L 10,18 L 13,22 L 23,22 L 26,18 L 33,18" stroke="#15803d" stroke-width="1" fill="none" />
    <path d="M 18,1 L 18,8" stroke="#4ade80" stroke-width="1" fill="none" />
    <path d="M 18,28 L 18,35" stroke="#4ade80" stroke-width="1" fill="none" />

    <!-- Terminal Chevron Glyphs inside hex -->
    <path d="M 11,13 L 17,18 L 11,23" stroke="#86efac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#lightning-spark)" fill="none" />
    <line x1="19" y1="23" x2="25" y2="23" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" filter="url(#lightning-spark)" />

    <!-- Tiny Lightning Spark on Hexagon -->
    <path d="M 31,7 L 34,11 L 32,12 L 36,17" stroke="url(#lightning-grad)" stroke-width="1.2" fill="none" filter="url(#lightning-spark)" />
  </g>

  <!-- Circuit Trace connecting Hex to Text -->
  <path d="M 45,26 L 54,26 L 58,21 L 62,21" stroke="#22c55e" stroke-width="1.5" fill="none" opacity="0.8" />
  <circle cx="54" cy="26" r="1.5" fill="#4ade80" />

  <!-- TEKROMANCY Main Title Text (Stylized Geometric Lettering) -->
  <text x="65" y="27" font-family="'Space Grotesk', 'JetBrains Mono', 'Segoe UI', sans-serif" font-weight="900" font-size="20" letter-spacing="2.5" fill="url(#cyber-text-grad)" filter="url(#neon-glow-green)">TEKROMANCY</text>

  <!-- Stylized Runes / Circuit Lightning Sparks over the title -->
  <path d="M 130,12 L 133,16 L 131,17 L 135,21" stroke="url(#lightning-grad)" stroke-width="1" fill="none" opacity="0.9" filter="url(#lightning-spark)" />
  <path d="M 235,11 L 237,14 L 235,15 L 239,19" stroke="url(#lightning-grad)" stroke-width="1" fill="none" opacity="0.9" filter="url(#lightning-spark)" />

  <!-- Subtitle Line with Micro Telemetry -->
  <g transform="translate(66, 38)">
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" letter-spacing="2" fill="#22EE44" opacity="0.95">&gt; INFRASTRUCTURE &amp; SORCERY_</text>
  </g>

  <!-- Bottom Circuit Bus Line with nodes -->
  <path d="M 12,48 L 70,48 L 74,44 L 160,44 L 164,48 L 278,48" stroke="url(#circuit-wire-grad)" stroke-width="1" fill="none" />
  <circle cx="74" cy="44" r="1.5" fill="#22c55e" />
  <circle cx="164" cy="48" r="1.5" fill="#38bdf8" />
  <circle cx="270" cy="48" r="1.5" fill="#22c55e" />

  <!-- Right End Status Pill -->
  <g transform="translate(252, 16)">
    <rect x="0" y="0" width="28" height="12" rx="2" fill="#0b1b10" stroke="#22c55e" stroke-width="0.8" />
    <text x="4" y="9" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="800" fill="#4ade80" letter-spacing="1">SYS</text>
    <circle cx="22" cy="6" r="2" fill="#22c55e" filter="url(#lightning-spark)" />
  </g>
</svg>
