<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 126 36" fill="none" class="cyber-transmit-badge">
  <defs>
    <filter id="badge-glow-tx" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="tx-border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="tx-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22EE44" />
      <stop offset="40%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="tx-spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Dark Glowing Plate with Chamfered Corners -->
  <polygon points="8,2 118,2 124,8 124,28 118,34 8,34 2,28 2,8" fill="#08140c" stroke="url(#tx-border-grad)" stroke-width="1.5" filter="url(#badge-glow-tx)" />

  <!-- Inner Circuit Grid Line -->
  <line x1="16" y1="6" x2="110" y2="6" stroke="#22c55e" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />
  <line x1="16" y1="30" x2="110" y2="30" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Animated Pulse Beacon Icon -->
  <g transform="translate(10, 10)">
    <!-- Radio Waves -->
    <path d="M 12,2 C 16,5 16,11 12,14" stroke="#38bdf8" stroke-width="1.2" fill="none" opacity="0.85" />
    <path d="M 9,4 C 12,6 12,10 9,12" stroke="#4ade80" stroke-width="1.2" fill="none" opacity="0.9" />
    <!-- Center Emitter Dot -->
    <circle cx="6" cy="8" r="2.5" fill="#22c55e" filter="url(#badge-glow-tx)" />
    <circle cx="6" cy="8" r="1.2" fill="#ffffff" />
  </g>

  <!-- Stylized Word "TRANSMIT" -->
  <text x="31" y="23" font-family="'Space Grotesk', 'JetBrains Mono', sans-serif" font-weight="900" font-size="12.5" letter-spacing="2" fill="url(#tx-text-grad)">TRANSMIT</text>

  <!-- Right Lightning Bolt Accent -->
  <path d="M 112,9 L 108,17 L 113,17 L 109,26" stroke="url(#tx-spark-grad)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#badge-glow-tx)" />
</svg>
