<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 12" fill="none" class="cyber-border-middle">
  <defs>
    <linearGradient id="trace-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#4ade80" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Horizontal Bus Line -->
  <line x1="0" y1="6" x2="120" y2="6" stroke="url(#trace-grad)" stroke-width="1.2" />

  <!-- 45-degree Circuit Branch Traces -->
  <path d="M 15,6 L 20,1 L 45,1 L 50,6" stroke="#22c55e" stroke-width="1" fill="none" opacity="0.8" />
  <circle cx="20" cy="1" r="1.2" fill="#86efac" />
  <circle cx="45" cy="1" r="1.2" fill="#86efac" />

  <path d="M 65,6 L 70,11 L 95,11 L 100,6" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.8" />
  <circle cx="70" cy="11" r="1.2" fill="#38bdf8" />
  <circle cx="95" cy="11" r="1.2" fill="#38bdf8" />

  <!-- Solder Pad / Via Nodes along the central bus -->
  <circle cx="5" cy="6" r="1.5" fill="#22c55e" />
  <circle cx="58" cy="6" r="1.5" fill="#4ade80" />
  <circle cx="115" cy="6" r="1.5" fill="#38bdf8" />

  <!-- Micro Lightning Pulse Spike -->
  <path d="M 55,6 L 57,3 L 59,9 L 61,6" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.95" />
</svg>
