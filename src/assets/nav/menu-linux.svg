<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 34" fill="none" class="cyber-word-badge">
  <defs>
    <filter id="badge-glow-lin" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="lin-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22EE44" />
      <stop offset="60%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>

  <!-- Dark Background Plate with Chamfered Left and Right Corners -->
  <polygon points="6,2 86,2 90,6 90,28 86,32 6,32 2,28 2,6" fill="#040905" stroke="#163821" stroke-width="1.2" />

  <!-- Neon Border Accent -->
  <path d="M 2,12 L 2,6 L 6,2 L 16,2" stroke="#22c55e" stroke-width="1.5" fill="none" filter="url(#badge-glow-lin)" />
  <path d="M 76,2 L 86,2 L 90,6 L 90,12" stroke="#22c55e" stroke-width="1.5" fill="none" filter="url(#badge-glow-lin)" />
  <path d="M 2,22 L 2,28 L 6,32 L 16,32" stroke="#22c55e" stroke-width="1.5" fill="none" filter="url(#badge-glow-lin)" />
  <path d="M 76,32 L 86,32 L 90,28 L 90,22" stroke="#22c55e" stroke-width="1.5" fill="none" filter="url(#badge-glow-lin)" />

  <!-- Micro Technical Index -->
  <text x="8" y="10" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="800" fill="#22c55e" opacity="0.8">02</text>

  <!-- Linux Terminal Prompt Hash -->
  <text x="8" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="900" fill="#4ade80">#</text>

  <!-- Stylized Word "LINUX" -->
  <text x="19" y="22" font-family="'Space Grotesk', 'JetBrains Mono', sans-serif" font-weight="800" font-size="12" letter-spacing="1.5" fill="url(#lin-text-grad)">LINUX</text>

  <!-- Right Circuit Lightning Dot -->
  <circle cx="82" cy="17" r="1.5" fill="#22c55e" filter="url(#badge-glow-lin)" />
  <path d="M 82,17 L 86,17" stroke="#22c55e" stroke-width="1" />
</svg>
