<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 114 34" fill="none" class="cyber-word-badge cyber-events-badge">
  <defs>
    <filter id="badge-glow-events" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="events-border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22EE44" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="events-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22EE44" />
      <stop offset="45%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="events-radar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22EE44" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Dark Background Plate with Chamfered Left and Right Corners -->
  <polygon points="7,2 107,2 112,7 112,27 107,32 7,32 2,27 2,7" fill="#060e08" stroke="url(#events-border-grad)" stroke-width="1.3" filter="url(#badge-glow-events)" />

  <!-- Neon Corner Brackets -->
  <path d="M 2,13 L 2,7 L 7,2 L 18,2" stroke="#22EE44" stroke-width="1.5" fill="none" />
  <path d="M 96,2 L 107,2 L 112,7 L 112,13" stroke="#fbbf24" stroke-width="1.5" fill="none" />
  <path d="M 2,21 L 2,27 L 7,32 L 18,32" stroke="#22EE44" stroke-width="1.5" fill="none" />
  <path d="M 96,32 L 107,32 L 112,27 L 112,21" stroke="#fbbf24" stroke-width="1.5" fill="none" />

  <!-- Micro Technical Status Flag -->
  <text x="7" y="10" font-family="'JetBrains Mono', monospace" font-size="5.5" font-weight="800" fill="#fbbf24" letter-spacing="0.5" opacity="0.9">LIVE</text>

  <!-- Radar / Targeting Crosshair Icon -->
  <g transform="translate(14, 18)">
    <circle cx="0" cy="0" r="6" stroke="#22c55e" stroke-width="0.9" stroke-dasharray="2 1.5" opacity="0.8" />
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#22c55e" stroke-width="0.7" opacity="0.7" />
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#22c55e" stroke-width="0.7" opacity="0.7" />
    <circle cx="0" cy="0" r="2.2" fill="#fbbf24" filter="url(#badge-glow-events)" />
    <circle cx="0" cy="0" r="1" fill="#ffffff" />
  </g>

  <!-- Stylized Word "EVENTS" -->
  <text x="27" y="22" font-family="'Space Grotesk', 'JetBrains Mono', sans-serif" font-weight="900" font-size="12" letter-spacing="2" fill="url(#events-text-grad)">EVENTS</text>

  <!-- Right Pulsing Beacon Dot & Antenna Waves -->
  <g transform="translate(101, 17)">
    <circle cx="0" cy="0" r="2" fill="#fbbf24" filter="url(#badge-glow-events)" />
    <circle cx="0" cy="0" r="1" fill="#ffffff" />
    <path d="M 3,-4 C 5,-2 5,2 3,4" stroke="#22EE44" stroke-width="1" fill="none" opacity="0.85" />
    <path d="M 6,-6 C 9,-3 9,3 6,6" stroke="#fbbf24" stroke-width="0.8" fill="none" opacity="0.7" />
  </g>
</svg>
