<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 102 34" fill="none" class="cyber-word-badge">
  <defs>
    <filter id="badge-glow-sec" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="sec-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22EE44" />
      <stop offset="60%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- Dark Background Plate with Chamfered Left and Right Corners -->
  <polygon points="6,2 96,2 100,6 100,28 96,32 6,32 2,28 2,6" fill="#040905" stroke="#163821" stroke-width="1.2" />

  <!-- Neon Border Accent -->
  <path d="M 2,12 L 2,6 L 6,2 L 16,2" stroke="#22c55e" stroke-width="1.5" fill="none" filter="url(#badge-glow-sec)" />
  <path d="M 86,2 L 96,2 L 100,6 L 100,12" stroke="#22c55e" stroke-width="1.5" fill="none" filter="url(#badge-glow-sec)" />
  <path d="M 2,22 L 2,28 L 6,32 L 16,32" stroke="#22c55e" stroke-width="1.5" fill="none" filter="url(#badge-glow-sec)" />
  <path d="M 86,32 L 96,32 L 100,28 L 100,22" stroke="#22c55e" stroke-width="1.5" fill="none" filter="url(#badge-glow-sec)" />

  <!-- Micro Technical Index -->
  <text x="8" y="10" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="800" fill="#22c55e" opacity="0.8">05</text>

  <!-- Shield / Lock Cyber Icon -->
  <path d="M 10,15 L 14,13 L 18,15 L 18,19 C 18,22 14,24 14,24 C 14,24 10,22 10,19 Z" stroke="#4ade80" stroke-width="1.2" fill="none" />

  <!-- Stylized Word "SECOPS" -->
  <text x="22" y="22" font-family="'Space Grotesk', 'JetBrains Mono', sans-serif" font-weight="800" font-size="12" letter-spacing="1.5" fill="url(#sec-text-grad)">SECOPS</text>

  <!-- Right Circuit Lightning Dot -->
  <circle cx="92" cy="17" r="1.5" fill="#22c55e" filter="url(#badge-glow-sec)" />
  <path d="M 92,17 L 96,17" stroke="#22c55e" stroke-width="1" />
</svg>
