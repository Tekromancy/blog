<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 10" fill="none" preserveAspectRatio="none">
  <defs>
    <!-- Intense High-Voltage Plasma Glow Filters -->
    <filter id="lightning-plasma-glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="blur1" />
      <feGaussianBlur stdDeviation="3.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="lightning-core-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="20%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#86efac" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <linearGradient id="bus-rail-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="30%" stop-color="#22c55e" />
      <stop offset="70%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>

  <style>
    @keyframes lightning-surge {
      0%, 100% { opacity: 0.92; }
      20% { opacity: 0.65; }
      25% { opacity: 1; }
      55% { opacity: 0.75; }
      60% { opacity: 1; }
      85% { opacity: 0.7; }
    }
    @keyframes branch-flicker {
      0%, 100% { opacity: 0.5; }
      15% { opacity: 0.95; }
      35% { opacity: 0.3; }
      65% { opacity: 1; }
      80% { opacity: 0.4; }
    }
    .live-lightning-main {
      animation: lightning-surge 2s infinite ease-in-out;
    }
    .live-lightning-forks {
      animation: branch-flicker 1.4s infinite ease-in-out;
    }
  </style>

  <!-- Base Neon Green Bus Wire (Anchor) -->
  <line x1="0" y1="4" x2="160" y2="4" stroke="url(#bus-rail-green)" stroke-width="2.5" opacity="0.85" />
  <line x1="0" y1="4" x2="160" y2="4" stroke="#4ade80" stroke-width="1" opacity="0.9" />

  <!-- Outer Plasma Green/Cyan Aura for Continuous Lightning -->
  <path 
    class="live-lightning-main"
    d="M 0,4 L 7,1 L 13,5 L 21,1.5 L 27,6.5 L 35,1 L 43,5 L 51,2 L 59,6.5 L 66,1 L 74,5.5 L 82,1.5 L 90,5 L 97,2 L 105,6.5 L 113,1 L 121,5 L 129,2 L 137,6 L 145,1.5 L 153,5 L 160,4" 
    stroke="#22c55e" 
    stroke-width="3.5" 
    stroke-linecap="round" 
    stroke-linejoin="miter" 
    opacity="0.8" 
    filter="url(#lightning-plasma-glow)" 
  />

  <!-- PRIMARY CONTINUOUS LIGHTNING BOLT (White-hot core dancing across entire 160px width) -->
  <path 
    class="live-lightning-main"
    d="M 0,4 L 7,1 L 13,5 L 21,1.5 L 27,6.5 L 35,1 L 43,5 L 51,2 L 59,6.5 L 66,1 L 74,5.5 L 82,1.5 L 90,5 L 97,2 L 105,6.5 L 113,1 L 121,5 L 129,2 L 137,6 L 145,1.5 L 153,5 L 160,4" 
    stroke="url(#lightning-core-grad)" 
    stroke-width="1.8" 
    stroke-linecap="round" 
    stroke-linejoin="miter" 
    fill="none" 
  />
  <path 
    class="live-lightning-main"
    d="M 0,4 L 7,1 L 13,5 L 21,1.5 L 27,6.5 L 35,1 L 43,5 L 51,2 L 59,6.5 L 66,1 L 74,5.5 L 82,1.5 L 90,5 L 97,2 L 105,6.5 L 113,1 L 121,5 L 129,2 L 137,6 L 145,1.5 L 153,5 L 160,4" 
    stroke="#ffffff" 
    stroke-width="0.9" 
    stroke-linecap="round" 
    stroke-linejoin="miter" 
    fill="none" 
  />

  <!-- SECONDARY INTERWOVEN COUNTER-PHASE ELECTRIC BOLT -->
  <path 
    class="live-lightning-forks"
    d="M 0,3.5 L 11,6.5 L 22,1 L 33,5.5 L 46,1.5 L 57,6.5 L 69,2 L 80,6 L 92,1 L 104,5.5 L 116,1.5 L 127,6.5 L 140,2 L 151,5.5 L 160,3.5" 
    stroke="#38bdf8" 
    stroke-width="1.2" 
    stroke-linecap="round" 
    stroke-linejoin="miter" 
    fill="none" 
    opacity="0.9" 
  />

  <!-- High-Voltage Fork Discharges Leaping Off the Rail -->
  <g class="live-lightning-forks" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" fill="none" filter="url(#lightning-plasma-glow)">
    <!-- Upward aerial discharges -->
    <path d="M 21,1.5 L 23,-0.5 L 26,1" />
    <path d="M 66,1 L 69,-1 L 72,1.2" />
    <path d="M 113,1 L 116,-0.8 L 119,1" />
    <!-- Downward grounding discharges -->
    <path d="M 27,6.5 L 30,9 L 33,7" stroke="#38bdf8" />
    <path d="M 59,6.5 L 62,9.2 L 65,7" stroke="#4ade80" />
    <path d="M 105,6.5 L 108,9 L 111,7" stroke="#38bdf8" />
    <path d="M 137,6 L 140,8.8 L 143,6.5" stroke="#4ade80" />
  </g>

  <!-- Electric Plasma Sparks / Nodes at discharge junctions -->
  <circle cx="7" cy="1" r="1.4" fill="#ffffff" filter="url(#lightning-plasma-glow)" />
  <circle cx="35" cy="1" r="1.4" fill="#ffffff" filter="url(#lightning-plasma-glow)" />
  <circle cx="66" cy="1" r="1.5" fill="#86efac" filter="url(#lightning-plasma-glow)" />
  <circle cx="97" cy="2" r="1.4" fill="#ffffff" filter="url(#lightning-plasma-glow)" />
  <circle cx="121" cy="5" r="1.4" fill="#38bdf8" filter="url(#lightning-plasma-glow)" />
  <circle cx="145" cy="1.5" r="1.4" fill="#ffffff" filter="url(#lightning-plasma-glow)" />

  <!-- Solder Vias along Green Bus -->
  <circle cx="4" cy="4" r="1.6" fill="#000000" stroke="#22c55e" stroke-width="0.8" />
  <circle cx="82" cy="4" r="1.6" fill="#000000" stroke="#4ade80" stroke-width="0.8" />
  <circle cx="156" cy="4" r="1.6" fill="#000000" stroke="#38bdf8" stroke-width="0.8" />
</svg>
