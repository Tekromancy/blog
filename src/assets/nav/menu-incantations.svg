<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 146 34" fill="none" class="cyber-word-badge">
  <defs>
    <filter id="badge-glow-inc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="inc-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22EE44" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="inc-border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Dark Background Plate with Chamfered Left and Right Corners -->
  <polygon points="6,2 140,2 144,6 144,28 140,32 6,32 2,28 2,6" fill="#05070a" stroke="#162738" stroke-width="1.2" />

  <!-- Neon Border Accent -->
  <path d="M 2,12 L 2,6 L 6,2 L 18,2" stroke="#22c55e" stroke-width="1.5" fill="none" filter="url(#badge-glow-inc)" />
  <path d="M 128,2 L 140,2 L 144,6 L 144,12" stroke="#c084fc" stroke-width="1.5" fill="none" filter="url(#badge-glow-inc)" />
  <path d="M 2,22 L 2,28 L 6,32 L 18,32" stroke="#22c55e" stroke-width="1.5" fill="none" filter="url(#badge-glow-inc)" />
  <path d="M 128,32 L 140,32 L 144,28 L 144,22" stroke="#c084fc" stroke-width="1.5" fill="none" filter="url(#badge-glow-inc)" />

  <!-- Micro Technical Index -->
  <text x="8" y="10" font-family="'JetBrains Mono', monospace" font-size="5.5" font-weight="800" fill="#38bdf8" opacity="0.9">0xHEX</text>

  <!-- Arcane Diamond Rune / Spark Sigil -->
  <g transform="translate(13, 18)">
    <polygon points="0,-5 4,0 0,5 -4,0" stroke="#38bdf8" stroke-width="1" fill="#040905" />
    <circle cx="0" cy="0" r="1.5" fill="#c084fc" filter="url(#badge-glow-inc)" />
    <line x1="0" y1="-8" x2="0" y2="-6" stroke="#22EE44" stroke-width="1" stroke-linecap="round" />
    <line x1="0" y1="6" x2="0" y2="8" stroke="#22EE44" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- Stylized Word "INCANTATIONS" -->
  <text x="21" y="22" font-family="'Space Grotesk', 'JetBrains Mono', sans-serif" font-weight="800" font-size="11.5" letter-spacing="1.2" fill="url(#inc-text-grad)">INCANTATIONS</text>

  <!-- Right Circuit Lightning Dot -->
  <circle cx="136" cy="17" r="1.5" fill="#c084fc" filter="url(#badge-glow-inc)" />
  <path d="M 136,17 L 140,17" stroke="#c084fc" stroke-width="1" />
</svg>
