<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 106 34" fill="none" class="cyber-word-badge">
  <defs>
    <filter id="badge-glow-sys" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="sys-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22EE44" />
      <stop offset="60%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>

  <!-- Dark Background Plate with Chamfered Left and Right Corners -->
  <polygon points="6,2 100,2 104,6 104,28 100,32 6,32 2,28 2,6" fill="#040905" stroke="#163821" stroke-width="1.2" />

  <!-- Neon Border Accent -->
  <path d="M 2,12 L 2,6 L 6,2 L 16,2" stroke="#22c55e" stroke-width="1.5" fill="none" filter="url(#badge-glow-sys)" />
  <path d="M 90,2 L 100,2 L 104,6 L 104,12" stroke="#22c55e" stroke-width="1.5" fill="none" filter="url(#badge-glow-sys)" />
  <path d="M 2,22 L 2,28 L 6,32 L 16,32" stroke="#22c55e" stroke-width="1.5" fill="none" filter="url(#badge-glow-sys)" />
  <path d="M 90,32 L 100,32 L 104,28 L 104,22" stroke="#22c55e" stroke-width="1.5" fill="none" filter="url(#badge-glow-sys)" />

  <!-- Micro Technical Index -->
  <text x="8" y="10" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="800" fill="#22c55e" opacity="0.8">SYS</text>

  <!-- Cluster Nodes Icon -->
  <g transform="translate(9, 14)">
    <circle cx="2" cy="3" r="1.3" fill="#22EE44" />
    <circle cx="7" cy="3" r="1.3" fill="#4ade80" />
    <circle cx="2" cy="8" r="1.3" fill="#4ade80" />
    <circle cx="7" cy="8" r="1.3" fill="#22EE44" />
    <line x1="2" y1="3" x2="7" y2="3" stroke="#22c55e" stroke-width="0.8" opacity="0.7" />
    <line x1="2" y1="8" x2="7" y2="8" stroke="#22c55e" stroke-width="0.8" opacity="0.7" />
    <line x1="2" y1="3" x2="2" y2="8" stroke="#22c55e" stroke-width="0.8" opacity="0.7" />
    <line x1="7" y1="3" x2="7" y2="8" stroke="#22c55e" stroke-width="0.8" opacity="0.7" />
  </g>

  <!-- Stylized Word "SYSTEMS" -->
  <text x="20" y="22" font-family="'Space Grotesk', 'JetBrains Mono', sans-serif" font-weight="800" font-size="11.5" letter-spacing="1.2" fill="url(#sys-text-grad)">SYSTEMS</text>

  <!-- Dropdown Caret / Chevron -->
  <path d="M 88,15 L 92,19 L 96,15" stroke="#4ade80" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#badge-glow-sys)" />
</svg>
