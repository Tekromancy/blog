<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 60" fill="none" preserveAspectRatio="none">
  <defs>
    <!-- Circuit Glow Filters -->
    <filter id="bg-glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="bg-glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients for Traces -->
    <linearGradient id="trace-bus-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" stop-opacity="0.3" />
      <stop offset="30%" stop-color="#22c55e" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#15803d" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="trace-bus-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="lightning-strike-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.1" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- OLED Pure Black Base -->
  <rect width="360" height="60" fill="#000000" />

  <!-- Subtle Micro Telemetry Hex/Grid Pattern -->
  <g opacity="0.12" stroke="#22c55e" stroke-width="0.5">
    <line x1="0" y1="15" x2="360" y2="15" stroke-dasharray="2 6" />
    <line x1="0" y1="30" x2="360" y2="30" stroke-dasharray="1 7" />
    <line x1="0" y1="45" x2="360" y2="45" stroke-dasharray="2 6" />
    
    <line x1="45" y1="0" x2="45" y2="60" stroke-dasharray="1 8" />
    <line x1="125" y1="0" x2="125" y2="60" stroke-dasharray="1 8" />
    <line x1="205" y1="0" x2="205" y2="60" stroke-dasharray="1 8" />
    <line x1="285" y1="0" x2="285" y2="60" stroke-dasharray="1 8" />
  </g>

  <!-- Deep PCB Circuit Tracks (Primary Bus 1) -->
  <g stroke="url(#trace-bus-1)" stroke-width="1.2" fill="none">
    <!-- Horizontal highway that jogs at 45 degrees -->
    <path d="M 0,18 L 40,18 L 52,30 L 105,30 L 115,20 L 160,20 L 170,30 L 220,30 L 230,20 L 285,20 L 297,32 L 360,32" />
    <!-- Secondary parallel branch -->
    <path d="M 0,22 L 38,22 L 50,34 L 103,34 L 113,24 L 158,24 L 168,34 L 218,34 L 228,24 L 283,24 L 295,36 L 360,36" opacity="0.5" />
  </g>

  <!-- Deep PCB Circuit Tracks (Bus 2 - Lower Channel) -->
  <g stroke="url(#trace-bus-2)" stroke-width="1" fill="none">
    <path d="M 0,42 L 55,42 L 67,54 L 130,54 L 140,44 L 190,44 L 200,54 L 255,54 L 267,42 L 360,42" />
    <path d="M 0,10 L 70,10 L 80,6 L 145,6 L 155,10 L 240,10 L 250,6 L 310,6 L 316,10 L 360,10" opacity="0.6" />
  </g>

  <!-- SMT Chip Footprint Blocks (IC Packages on Motherboard) -->
  <g opacity="0.35">
    <!-- Micro controller footprint 1 -->
    <rect x="75" y="16" width="18" height="10" rx="1" fill="#051c0d" stroke="#22c55e" stroke-width="0.8" />
    <line x1="77" y1="14" x2="77" y2="16" stroke="#4ade80" stroke-width="0.8" />
    <line x1="81" y1="14" x2="81" y2="16" stroke="#4ade80" stroke-width="0.8" />
    <line x1="85" y1="14" x2="85" y2="16" stroke="#4ade80" stroke-width="0.8" />
    <line x1="89" y1="14" x2="89" y2="16" stroke="#4ade80" stroke-width="0.8" />
    <line x1="77" y1="26" x2="77" y2="28" stroke="#4ade80" stroke-width="0.8" />
    <line x1="81" y1="26" x2="81" y2="28" stroke="#4ade80" stroke-width="0.8" />
    <line x1="85" y1="26" x2="85" y2="28" stroke="#4ade80" stroke-width="0.8" />
    <line x1="89" y1="26" x2="89" y2="28" stroke="#4ade80" stroke-width="0.8" />

    <!-- Micro controller footprint 2 -->
    <rect x="235" y="34" width="20" height="11" rx="1" fill="#041822" stroke="#38bdf8" stroke-width="0.8" />
    <line x1="238" y1="32" x2="238" y2="34" stroke="#38bdf8" stroke-width="0.8" />
    <line x1="242" y1="32" x2="242" y2="34" stroke="#38bdf8" stroke-width="0.8" />
    <line x1="246" y1="32" x2="246" y2="34" stroke="#38bdf8" stroke-width="0.8" />
    <line x1="250" y1="32" x2="250" y2="34" stroke="#38bdf8" stroke-width="0.8" />
    <line x1="238" y1="45" x2="238" y2="47" stroke="#38bdf8" stroke-width="0.8" />
    <line x1="242" y1="45" x2="242" y2="47" stroke="#38bdf8" stroke-width="0.8" />
    <line x1="246" y1="45" x2="246" y2="47" stroke="#38bdf8" stroke-width="0.8" />
    <line x1="250" y1="45" x2="250" y2="47" stroke="#38bdf8" stroke-width="0.8" />
  </g>

  <!-- Solder Vias (Through-hole Pads with glowing rings) -->
  <g>
    <!-- Green Vias -->
    <circle cx="40" cy="18" r="2.2" fill="#040905" stroke="#22c55e" stroke-width="0.8" />
    <circle cx="40" cy="18" r="0.9" fill="#4ade80" filter="url(#bg-glow-green)" />

    <circle cx="105" cy="30" r="2.2" fill="#040905" stroke="#22c55e" stroke-width="0.8" />
    <circle cx="105" cy="30" r="0.9" fill="#4ade80" filter="url(#bg-glow-green)" />

    <circle cx="160" cy="20" r="2.2" fill="#040905" stroke="#22c55e" stroke-width="0.8" />
    <circle cx="160" cy="20" r="0.9" fill="#4ade80" filter="url(#bg-glow-green)" />

    <circle cx="285" cy="20" r="2.2" fill="#040905" stroke="#22c55e" stroke-width="0.8" />
    <circle cx="285" cy="20" r="0.9" fill="#4ade80" filter="url(#bg-glow-green)" />

    <!-- Cyan Vias -->
    <circle cx="55" cy="42" r="2.2" fill="#040905" stroke="#38bdf8" stroke-width="0.8" />
    <circle cx="55" cy="42" r="0.9" fill="#38bdf8" filter="url(#bg-glow-cyan)" />

    <circle cx="190" cy="44" r="2.2" fill="#040905" stroke="#38bdf8" stroke-width="0.8" />
    <circle cx="190" cy="44" r="0.9" fill="#38bdf8" filter="url(#bg-glow-cyan)" />

    <circle cx="267" cy="42" r="2.2" fill="#040905" stroke="#38bdf8" stroke-width="0.8" />
    <circle cx="267" cy="42" r="0.9" fill="#38bdf8" filter="url(#bg-glow-cyan)" />
  </g>

  <!-- Micro Lightning Pulse Discharges -->
  <g filter="url(#bg-glow-green)">
    <path d="M 115,20 L 123,17 L 126,22 L 135,19" stroke="url(#lightning-strike-bg)" stroke-width="1.1" fill="none" opacity="0.85" />
    <path d="M 297,32 L 305,29 L 308,34 L 318,31" stroke="url(#lightning-strike-bg)" stroke-width="1.1" fill="none" opacity="0.85" />
  </g>

  <!-- Micro Runes / Telemetry Markings in PCB silkscreen -->
  <text x="15" y="52" fill="#15803d" font-family="monospace" font-size="5" font-weight="bold" letter-spacing="1" opacity="0.45">BUS.01 // RX-TX</text>
  <text x="175" y="14" fill="#0369a1" font-family="monospace" font-size="5" font-weight="bold" letter-spacing="1" opacity="0.45">0x7F_KRNL</text>
  <text x="315" y="52" fill="#15803d" font-family="monospace" font-size="5" font-weight="bold" letter-spacing="1" opacity="0.45">TEKRO_CORE</text>

  <!-- Ambient Darkening Edge Vignettes to blend smoothly -->
  <rect x="0" y="0" width="360" height="60" fill="url(#vignette-grad)" opacity="0.4" pointer-events="none" />
</svg>
