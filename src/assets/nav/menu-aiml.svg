<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 94 34" fill="none" class="cyber-word-badge">
  <defs>
    <filter id="badge-glow-aiml" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="aiml-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22EE44" />
      <stop offset="60%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Dark Background Plate with Chamfered Left and Right Corners -->
  <polygon points="6,2 88,2 92,6 92,28 88,32 6,32 2,28 2,6" fill="#040905" stroke="#163821" stroke-width="1.2" />

  <!-- Neon Border Accent -->
  <path d="M 2,12 L 2,6 L 6,2 L 16,2" stroke="#10b981" stroke-width="1.5" fill="none" filter="url(#badge-glow-aiml)" />
  <path d="M 78,2 L 88,2 L 92,6 L 92,12" stroke="#10b981" stroke-width="1.5" fill="none" filter="url(#badge-glow-aiml)" />
  <path d="M 2,22 L 2,28 L 6,32 L 16,32" stroke="#10b981" stroke-width="1.5" fill="none" filter="url(#badge-glow-aiml)" />
  <path d="M 78,32 L 88,32 L 92,28 L 92,22" stroke="#10b981" stroke-width="1.5" fill="none" filter="url(#badge-glow-aiml)" />

  <!-- Micro Technical Index -->
  <text x="8" y="10" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="800" fill="#10b981" opacity="0.8">04</text>

  <!-- Neural Core / Synapse Icon -->
  <circle cx="12" cy="18" r="1.5" fill="#34d399" />
  <circle cx="16" cy="15" r="1.5" fill="#34d399" />
  <circle cx="14" cy="22" r="1.5" fill="#34d399" />
  <line x1="12" y1="18" x2="16" y2="15" stroke="#10b981" stroke-width="1" />
  <line x1="12" y1="18" x2="14" y2="22" stroke="#10b981" stroke-width="1" />
  <line x1="16" y1="15" x2="14" y2="22" stroke="#10b981" stroke-width="1" />

  <!-- Stylized Word "AI / ML" -->
  <text x="21" y="22" font-family="'Space Grotesk', 'JetBrains Mono', sans-serif" font-weight="800" font-size="12" letter-spacing="1.5" fill="url(#aiml-text-grad)">AI / ML</text>

  <!-- Right Circuit Lightning Dot -->
  <circle cx="84" cy="17" r="1.5" fill="#10b981" filter="url(#badge-glow-aiml)" />
  <path d="M 84,17 L 88,17" stroke="#10b981" stroke-width="1" />
</svg>
