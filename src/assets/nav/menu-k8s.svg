<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 34" fill="none" class="cyber-word-badge">
  <defs>
    <filter id="badge-glow-k8s" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="k8s-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22EE44" />
      <stop offset="60%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Dark Background Plate with Chamfered Left and Right Corners -->
  <polygon points="6,2 78,2 82,6 82,28 78,32 6,32 2,28 2,6" fill="#040905" stroke="#102a38" stroke-width="1.2" />

  <!-- Neon Border Accent (Cyan & Green) -->
  <path d="M 2,12 L 2,6 L 6,2 L 16,2" stroke="#38bdf8" stroke-width="1.5" fill="none" filter="url(#badge-glow-k8s)" />
  <path d="M 68,2 L 78,2 L 82,6 L 82,12" stroke="#38bdf8" stroke-width="1.5" fill="none" filter="url(#badge-glow-k8s)" />
  <path d="M 2,22 L 2,28 L 6,32 L 16,32" stroke="#38bdf8" stroke-width="1.5" fill="none" filter="url(#badge-glow-k8s)" />
  <path d="M 68,32 L 78,32 L 82,28 L 82,22" stroke="#38bdf8" stroke-width="1.5" fill="none" filter="url(#badge-glow-k8s)" />

  <!-- Micro Technical Index -->
  <text x="8" y="10" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="800" fill="#38bdf8" opacity="0.8">03</text>

  <!-- Cluster Helm / Hex Node Icon -->
  <polygon points="12,17 15,14 18,17 18,21 15,24 12,21" stroke="#38bdf8" stroke-width="1.2" fill="none" />
  <circle cx="15" cy="19" r="1" fill="#ffffff" />

  <!-- Stylized Word "K8S" -->
  <text x="24" y="22" font-family="'Space Grotesk', 'JetBrains Mono', sans-serif" font-weight="800" font-size="12" letter-spacing="1.5" fill="url(#k8s-text-grad)">K8S</text>

  <!-- Right Circuit Lightning Dot -->
  <circle cx="74" cy="17" r="1.5" fill="#38bdf8" filter="url(#badge-glow-k8s)" />
  <path d="M 74,17 L 78,17" stroke="#38bdf8" stroke-width="1" />
</svg>
